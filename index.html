<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140707">
  <meta name="color-scheme" content="dark">
  <title>Menu · Folomi Paris</title>

  <style>
    /* ===============================
       RESET & BASE
       =============================== */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      background-color: #0f0505;
      color: #e8d6b3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Uniquement sur html : posé aussi sur body, overflow-y passerait à auto
       sur les deux et le body créerait une seconde barre de défilement. */
    html { overflow-x: hidden; }

    body { overscroll-behavior: none; }

    /* ===============================
       FOND LUXE TEXTURÉ
       =============================== */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(1050px 650px at 50% -10%, rgba(255,215,140,0.12), transparent 62%),
        radial-gradient(800px 520px at 15% 40%, rgba(120,20,20,0.48), transparent 62%),
        radial-gradient(820px 520px at 85% 40%, rgba(50,10,10,0.62), transparent 62%),
        linear-gradient(180deg, #140707, #0a0303);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(255,215,140,0.04),
        rgba(255,215,140,0.04) 1px,
        transparent 2px,
        transparent 7px
      );
      opacity: 0.22;
      pointer-events: none;
    }

    /* ===============================
       RIDEAU DORÉ LUXE (INTRO)
       =============================== */
    .curtain {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      background:
        radial-gradient(1100px 700px at 50% 15%, rgba(255,215,140,0.22), transparent 62%),
        linear-gradient(180deg, rgba(10,3,3,0.96), rgba(10,3,3,0.88));
      animation: curtainOut 1.2s cubic-bezier(.2,.9,.2,1) forwards;
      animation-delay: .1s;
    }

    @keyframes curtainOut {
      0% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* ===============================
       ANIMATIONS
       =============================== */
    /* Ouverture de la couverture, au chargement */
    @keyframes coverReveal {
      from { opacity: 0; transform: scale(1.04); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Liseré doré qui balaie le haut de la carte */
    @keyframes goldSweep {
      from { transform: scaleX(0); opacity: 0; }
      35% { opacity: 1; }
      to { transform: scaleX(1); opacity: 0; }
    }

    /* ===============================
       COUVERTURE (EN-TÊTE)
       =============================== */
    header {
      width: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(10,3,3,0.95), rgba(10,3,3,0.7));
      border-bottom: 1px solid rgba(255,215,140,0.18);
      padding: 0;
      line-height: 0;
    }

    header img {
      width: 100%;
      height: auto;
      aspect-ratio: 1655 / 2340;
      display: block;
      margin: 0 auto;
      animation: coverReveal 1.1s cubic-bezier(.2,.8,.2,1) both;
      animation-delay: .35s;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
    }

    /* ===============================
       CARTES MENU
       =============================== */
    main {
      width: 100%;
      max-width: 100%;
      padding: 0 0 env(safe-area-inset-bottom);
    }

    /* Révélation au scroll : classe .is-visible posée par IntersectionObserver */
    section {
      position: relative;
      overflow: hidden;
      border-top: 1px solid rgba(255,215,140,0.14);
      opacity: 0;
      transform: translateY(28px);
      transition:
        opacity .9s cubic-bezier(.2,.8,.2,1),
        transform .9s cubic-bezier(.2,.8,.2,1);
      will-change: opacity, transform;
    }

    section.is-visible {
      opacity: 1;
      transform: translateY(0);
      will-change: auto;
    }

    section::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      z-index: 2;
      transform-origin: left center;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,215,140,0.85),
        rgba(255,240,200,0.95),
        rgba(255,215,140,0.85),
        transparent
      );
      transform: scaleX(0);
      opacity: 0;
      pointer-events: none;
    }

    section.is-visible::before {
      animation: goldSweep .9s ease-out both;
    }

    section img {
      width: 100%;
      height: auto;
      aspect-ratio: 1655 / 2340;
      display: block;
      margin-inline: auto;
      box-shadow: 0 16px 36px rgba(0,0,0,0.5);
    }

    /* ===============================
       ACCESSIBILITÉ
       =============================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }

      header img { opacity: 1; transform: none; }

      section {
        opacity: 1;
        transform: none;
        will-change: auto !important;
      }

      section::before { opacity: 0; }

      .curtain { display: none; }
    }
  </style>

  <!-- Sans JavaScript, les cartes restent visibles -->
  <noscript>
    <style>
      section { opacity: 1 !important; transform: none !important; }
      .curtain { display: none; }
    </style>
  </noscript>
</head>

<body>

  <!-- Rideau luxe -->
  <div class="curtain"></div>

  <!-- COUVERTURE -->
  <header>
    <img src="couverture.webp"
         srcset="couverture.webp 1655w, couverture@2x.webp 2482w"
         sizes="100vw"
         alt="Folomi Paris, menu" width="1655" height="2340" fetchpriority="high">
  </header>

  <!-- CARTES -->
  <main>
    <section>
      <img src="carte_formules.webp"
           srcset="carte_formules.webp 1655w, carte_formules@2x.webp 2482w"
           sizes="100vw"
           alt="Carte Formules" width="1655" height="2340">
    </section>

    <section>
      <img src="carte_chicha.webp"
           srcset="carte_chicha.webp 1655w, carte_chicha@2x.webp 2482w"
           sizes="100vw"
           alt="Carte Chicha" width="1655" height="2340" loading="lazy">
    </section>

    <section>
      <img src="carte_entrees.webp"
           srcset="carte_entrees.webp 1655w, carte_entrees@2x.webp 2482w"
           sizes="100vw"
           alt="Carte Entrées" width="1655" height="2340" loading="lazy">
    </section>

    <section>
      <img src="carte_plats.webp"
           srcset="carte_plats.webp 1655w, carte_plats@2x.webp 2482w"
           sizes="100vw"
           alt="Carte Plats" width="1655" height="2340" loading="lazy">
    </section>

    <section>
      <img src="carte_boissons.webp"
           srcset="carte_boissons.webp 1655w, carte_boissons@2x.webp 2482w"
           sizes="100vw"
           alt="Carte Pâtes et Boissons" width="1655" height="2340" loading="lazy">
    </section>

    <section>
      <img src="carte_desserts.webp"
           srcset="carte_desserts.webp 1655w, carte_desserts@2x.webp 2482w"
           sizes="100vw"
           alt="Carte Desserts" width="1655" height="2340" loading="lazy">
    </section>

    <section>
      <img src="carte_cocktails.webp"
           srcset="carte_cocktails.webp 1655w, carte_cocktails@2x.webp 2482w"
           sizes="100vw"
           alt="Carte Cocktails sans alcool" width="1655" height="2340" loading="lazy">
    </section>
  </main>

  <script>
    // Sécurité : retire le rideau même en cas de chargement lent
    window.addEventListener("load", () => {
      const curtain = document.querySelector(".curtain");
      if (curtain) setTimeout(() => curtain.remove(), 600);
    });

    // Révélation des cartes à l'entrée dans le viewport
    (() => {
      const sections = document.querySelectorAll("main section");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (reducedMotion || !("IntersectionObserver" in window)) {
        sections.forEach((section) => section.classList.add("is-visible"));
        return;
      }

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          });
        },
        { threshold: 0.12, rootMargin: "0px 0px -6% 0px" }
      );

      sections.forEach((section) => observer.observe(section));
    })();
  </script>

</body>
</html>
